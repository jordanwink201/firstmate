name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            exit 0
          fi
          # Current no-mistakes emits a structured comment instead of the footer.
          # This checks provenance shape, not pipeline completion or current HEAD:
          # the PR/CI steps can still be running and fixes can advance the head.
          if python3 - <<'PY'
          import json
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          for payload in re.findall(r"<!-- no-mistakes-pipeline-attestation:v1 (.*?) -->", body, re.DOTALL):
              try:
                  attestation = json.loads(payload)
              except ValueError:
                  continue
              if not isinstance(attestation, dict):
                  continue
              head = attestation.get("head_sha")
              steps = attestation.get("steps")
              if not isinstance(head, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", head):
                  continue
              if isinstance(steps, list) and steps and all(
                  isinstance(step, dict) and all(
                      isinstance(step.get(key), str) and step[key].strip()
                      for key in ("step", "status")
                  ) for step in steps
              ):
                  sys.exit(0)
          sys.exit(1)
          PY
          then
            echo "Found no-mistakes attestation in PR #${PR_NUMBER} body."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline writes a no-mistakes-pipeline-attestation:v1 JSON comment"
            echo "into the PR body. Older versions write a '## Pipeline' section containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
